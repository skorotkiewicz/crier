# Crier presets. Use -c FILE to select a custom config.
default_preset: local

# TCP direct preset
local:
  addr: "localhost:5555"
  auth: example-token
  message: 'notify-send "Local" "{}"'

# MQTT relay preset
mybuilds:
  relay: test.mosquitto.org
  port: 1883
  topic: ci/example
  message: 'notify-send "Build" "{}"'

# Use a script for logging or other shell operations.
alerts:
  relay: test.mosquitto.org
  topic: ci/example/alerts
  message: './on-message.sh "{}"'
